[project]
name = "phosphor-local"
version = "0.1.0"
description = "Local screenshot-enabled server for the Phosphor graphics experiment"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pylint==4.0.8",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "semgrep==1.176.1",
]
